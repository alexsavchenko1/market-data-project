[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-platform"
version = "0.1.0"
description = "Concurrent market data aggregation and analysis service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1.0",
    "matplotlib>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
    "pyright[nodejs]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".tickerforge"